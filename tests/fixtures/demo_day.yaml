  # ── C. 정치: 예산안 공방 (입장이 갈림, 매체군 3개 → 쟁점 정리) ──
  - key: 예산안
    articles:
      - outlet: 가상일보
        hours_ago: 14
        title: 가람당 "지역 일자리 예산 늘려야" 새벽당 "재정 건전성 먼저"
        body: |
          내년도 예산안 심사를 앞두고 가람당과 새벽당이 {D}일 서로 다른 요구를 내놓았다. 정부가 국회에 제출한 예산안 규모는 680조원이다.
          가람당 정책위의장인 윤가온 의원은 국회 기자회견에서 "지역 일자리 예산을 늘려야 한다"고 주장했다. 윤 의원은 지방 청년 고용률이 3년째 떨어졌다는 통계를 근거로 들었다. 가람당은 지역 일자리 사업에 2조원을 더 배정하자고 제안했다.
