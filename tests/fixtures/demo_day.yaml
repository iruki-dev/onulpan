  # ── B. 사회: 한빛시 물류창고 화재 (사망자 수가 매체마다 다름 → conflicts) ──
  - key: 물류창고
    articles:
      - outlet: 가상통신
        hours_ago: 12
        title: 한빛시 물류창고 화재로 작업자 3명 숨져
        body: |
          {M}월 {D}일 새벽 한빛시 서구의 한 물류창고에서 불이 나 작업자 3명이 숨지고 5명이 다쳤다.
          한빛소방본부에 따르면 불은 오전 2시 10분께 창고 2층 포장 구역에서 시작된 것으로 파악됐다.
          소방당국은 인력 120명과 장비 40대를 투입해 약 4시간 만에 큰 불길을 잡았다.
          부상자 가운데 2명은 연기를 많이 마셔 중상인 것으로 전해졌다. 소방본부와 경찰은 합동 감식으로 정확한 화재 원인을 조사할 예정이다.
      - outlet: 가상일보
        hours_ago: 11
        title: 한빛시 창고 새벽 화재…작업자 4명 사망
        body: |
          한빛시 서구 물류창고에서 {D}일 새벽 큰불이 나 야간 근무 중이던 작업자 4명이 숨졌다. 다친 사람은 5명이다.
          창고 운영사는 화재 당시 내부에 직원 30여 명이 있었다고 밝혔다. 창고 면적은 약 2만 제곱미터다.
          한빛소방본부는 스프링클러가 제대로 작동했는지 확인하고 있다고 말했다.
      - outlet: 가상방송
        hours_ago: 10
        title: 물류창고 화재 3명 숨지고 5명 다쳐
        body: |
          오늘 새벽 한빛시의 물류창고에서 불이 나 작업자 3명이 숨지고 5명이 다쳤습니다.
          소방당국은 장비 40대를 동원해 4시간 만에 큰 불을 껐습니다.
          한빛소방본부는 창고 2층에서 불이 시작됐다는 목격자 진술을 확보했습니다.
    drafts:
      fact:
        kind: fact
        section: society
        title: 한빛시 물류창고 새벽 화재로 작업자 숨져
        summary: 한빛시 서구 물류창고 화재로 작업자가 숨지고 5명이 다쳤으며 사망자 수는 매체마다 다르다.
