# 하루치 가상 묶음. 매체·기업·인물·정당·도시는 모두 지어낸 것이다(실제 언론사의 보도로 오인되지 않게 ‘가상’ 매체를 쓴다).
# {M}월 {D}일은 시드 시각 기준 날짜로 채운다. hours_ago는 발행 시각(지금으로부터 몇 시간 전).
# drafts는 가짜 LLM이 돌려줄 초안이다. {가상통신} 같은 자리표시자는 그 매체 기사의 입력 id(r_…)로 바뀐다.

outlets:
