        hours_ago: 9
        title: 누리전자, 3분기 영업이익 1조2000억원…전년보다 12% 늘어
        body: |
          누리전자가 {M}월 {D}일 3분기 실적을 공시했다. 회사에 따르면 3분기 매출은 18조원, 영업이익은 1조2000억원으로 집계됐다.
          영업이익은 지난해 같은 기간보다 12% 증가했다. 메모리 반도체 부문의 판매가 늘어난 것이 실적을 끌어올렸다고 회사는 설명했다.
          이하준 누리전자 대표는 이날 콘퍼런스콜에서 "메모리 수요가 뚜렷하게 회복되고 있다"고 말했다.
          회사는 4분기에도 서버용 메모리 공급을 확대할 계획이라고 밝혔다. 증권가에서는 누리전자의 연간 영업이익이 4조원을 넘을 수 있다는 분석을 내놓았다.
          누리전자 주가는 공시 이후 장중 한때 3% 올랐다.
