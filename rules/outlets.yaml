# 수집 대상 매체. 성향으로 분류하지 않는다. 매체군(형태)만 둔다.
# grp: national_daily | broadcast | wire | economic | regional | online | public
# verified: 피드 주소가 실제로 항목을 돌려주는 것을 확인한 날짜. active: false는 주소 확인 전이라 수집하지 않는다.
# 바뀌면 이 파일을 고치고 `python -m worker.jobs.cli sync-outlets`. 편집 원칙 페이지의 공개 목록도 여기서 나온다.

