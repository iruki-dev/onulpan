# 베타 모드: 사용자 300명, 하루 생성 25~30편, 월 5만 원 이하
# 코드는 같고 설정값만 다르다. 출시 모드와 다른 값만 launch.yaml에서 덮어쓴다.
mode: beta

collect:
  interval_minutes: 15
  min_request_interval_s: 1.0         # 같은 도메인 요청 간격
  user_agent: "OnulpanBot/1.0 (+https://onulpan.kr/principles; contact: bot@onulpan.kr)"
  body_max_chars: 20000
  min_body_chars: 200                 # 이보다 짧으면 유료·로그인 영역으로 보고 건너뜀

dedup:
  shingle: 3
  hamming_max: 3                      # 이하이면 통신사 전재로 보고 중복 처리
  lookback_hours: 48

cluster:
  embed_input_chars: 1200             # 제목+리드 약 512토큰
  join: 0.82                          # 이상이면 합류
  gray_low: 0.70                      # 0.70~0.82 회색 구간
  window_hours: 48                    # 48시간 이내 열린 묶음
  gray_shared_nnp_min: 2
  gray_max_gap_hours: 12
  gray_llm: false                     # 출시 모드에서만 Haiku로 판정
  rep_articles: 5                     # 회색 구간 고유명사 비교에 쓰는 대표 기사 수
  close_after_hours: 48

select:
  min_outlets: 2
  recent_hours: 24
  quiet_minutes: 60
  stable_articles: 5
  daily_cap: 30
  immediate_top: 5                    # 1면 후보(중요도 상위 5)는 즉시 호출
  breaking_outlets: 4                 # 첫 기사 3시간 안에 매체 4곳 이상이면 속보성
  breaking_hours: 3
  expire_hours: 36

generate:
  max_articles: 6
  article_chars: 1500
  related_posts: 3
  model: claude-sonnet-5
  max_tokens: { fact: 1500, synthesis: 2200, issue: 2500, explainer: 2000, culture: 2200, correction: 1500 }
  thinking: disabled                  # adaptive | disabled
  structured_output: false            # true면 output_config.format(json_schema)로 JSON을 강제
  batch_timeout_hours: 24

verify:
  semantic_llm: false                 # V11. 출시 모드에서 켠다
  semantic_model: claude-haiku-4-5
  copy_max_run: 7                     # 가장 긴 공통 어절 열
  copy_ngram: 5
  copy_ngram_ratio: 0.15
  fact_similarity: 0.75               # V10 (bge-m3 기준)
  fact_similarity_hashing: 0.45       # 해시 임베더(개발·테스트) 기준
  max_quotes: 2
  quote_max_chars: 40
  lengths:
    title: 36
    summary: 80
    body:
      fact: [400, 700]
      synthesis: [800, 1200]
      issue: [1000, 1400]
      explainer: [700, 1000]
      culture: [1000, 1200]
      correction: [150, 700]
    tolerance: 0.1                    # 분량 범위 ±10%까지 허용

review:
  enabled: true                       # 베타: 검증 통과 초안은 drafts에서 사람 검토
  auto_publish_at: "06:20"

triggers:
  synthesis_min_facts: 3
  synthesis_stale_days: 7
  explainer_window_days: 14
  explainer_min_posts: 3
  explainer_daily_cap: 3
  issue_min_groups: 3
  issue_daily_cap: 1
  culture_weekly: 7

budget:
  monthly_usd: 30                     # 환경 변수 ONULPAN_BUDGET_USD가 있으면 그 값
  alert_ratio: 0.8

editor:
  version: "e1"
  window_hours: 36
  fallback_window_hours: 72
  catchup_max: 3
  section_cap: 0.40
  novelty_days: 3
  novelty_factor: 0.6
  weights: { more: 1.3, normal: 1.0, less: 0.7 }
  chars_per_minute: 550
  brief_chars: 130                    # 단신 1편의 지면 분량(제목+요약)

importance:
  group_bonus: 0.25
  decay_hours: 18

front:
  select_at: "06:25"
  n: 3
  same_section_max: 2
  window_hours: 24
  log_top: 10

schedule:
  assemble_at: "06:30"
  send_hours: [7, 8, 9, 10]
  culture_at: "Sun 22:00"

email:
  from: "오늘판 <paper@onulpan.kr>"
  retry_minutes: 10

images:                               # 기준: docs/images.md, 출처·순서: rules/image_sources.yaml
  enabled: true
  kinds: [fact, synthesis, issue, explainer, culture]
  lookback_hours: 48                  # 이 시간 안에 쓴 글에만 찾는다
  per_run: 20
  max_attempts: 2
  retry_hours: 6                      # 못 찾은 글은 이만큼 지나 한 번 더
  brief_llm: true                     # API 키가 있으면 Haiku로 검색어·대체 텍스트를 만든다
  brief_model: claude-haiku-4-5
  auto_approve: false                 # 베타: 자동으로 찾은 사진은 관리 화면에서 승인해야 실린다
  vision_check: false                 # 출시: 사진이 기사 대상과 맞는지 Claude가 한 번 본다
  candidates_per_source: 5
  min_width: 800
  render_width: 1600                  # 표시용 축소본 가로 (비율 유지, 자르지 않음)
  max_bytes: 15000000
  request_reply_days: 3               # 권리자 요청 회신 기한
